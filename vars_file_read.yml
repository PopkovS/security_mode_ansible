# Тот же класс риска, что у copy — чтение произвольного файла сервера,
# но через переменные, а не через модуль. Два способа вызвать одно и то же.

- hosts: all

  vars_files:
    - /etc/ansible/secret.yml   # читается на сервере при старте плея

  tasks:
    - debug:
        var: some_variable       # содержимое утёкшего файла

    - include_vars:
        file: /etc/ansible/secret.yml
        # то же самое, но можно вызвать в любом месте плейбука

    - include_vars:
        dir: /etc/ansible/         # можно указать директорию —
        # тогда читаются и выводятся ВСЕ yml/json файлы из неё за один таск

# Безопасного варианта у этих директив нет — если разрешать вообще,
# то только по allowlist конкретных путей внутри плейбука проекта,
# не по произвольному пути с сервера.
#
# Детект:
#   ^\s*vars_files\s*:                     (play-level ключ, потом список путей)
#   \binclude_vars\s*:                     (и короткая форма include_vars: path.yml)
#   параметр dir: внутри include_vars — считать так же опасным, как file:
