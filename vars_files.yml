- hosts: all

  vars_files:
    # Файл читается на сервере и его содержимое становится переменными,
    # которые потом можно вывести через debug. Тот же класс риска, что
    # у copy/template — чтение произвольного файла сервера, только через
    # YAML-переменные.
    - /etc/ansible/secret.yml

  tasks:
    - debug:
        var: some_variable