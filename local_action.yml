- hosts: all
  tasks:
    - local_action:
        # local_action — это старый синтаксис delegate_to: localhost.
        # Выполняет команду НА СЕРВЕРЕ, даже если hosts: all указывает на
        # обычных клиентов. Раз вы уже блокируете delegate_to: localhost,
        # обязательно проверяйте и local_action отдельно — это не то же самое
        # поле, наивный grep по "delegate_to" его не поймает.
        module: command
        argv:
          - hostname
    # Также проверяйте local_action и как inline-строку:
    # - local_action: command hostname

    