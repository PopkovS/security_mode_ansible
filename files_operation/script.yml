# script читает файл по src С СЕРВЕРА и передаёт его на клиента для
# исполнения. Клиент, управляя своим хостом, может подменить интерпретатор
# и получить исходный текст файла целиком — то есть прочитать произвольный
# файл сервера, если путь не ограничен.

- hosts: all
  tasks:
    - script: /usr/share/assistant/ast-ansible/PASHA_ANS/test.sh

# У модуля нет флага вроде remote_src — src всегда читается на сервере,
# это его смысл. Единственный вариант обезопасить — жёсткий allowlist
# директорий, из которых вообще разрешено указывать src (например, только
# внутри папки самого плейбука проекта, никаких абсолютных путей наружу).
#
# Детект: модуль script — блокировать всегда, либо разрешать только если
# путь src начинается с разрешённого префикса (сравнивать после
# нормализации пути, чтобы ../ не обходил проверку).
