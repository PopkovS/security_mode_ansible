# Опасен по двум причинам:
# 1) src читается на сервере и уходит клиенту, как в copy;
# 2) содержимое рендерится как Jinja2 НА СЕРВЕРЕ перед отправкой — если
#    в файле есть {{ lookup('file','/etc/shadow') }} или
#    {{ lookup('pipe','id') }}, это выполнится на сервере.

- hosts: all
  tasks:
    - ansible.builtin.template:
        src: /usr/share/assistant/ast-ansible/appsettings.json
        dest: /opt/appsettings.json

# У template нет remote_src: true (шаблон обязан лежать на контроллере,
# в этом весь смысл модуля) — поэтому ограничение пути src не спасает
# от пункта 2. Модуль остаётся опасным при любом src, если не запрещены
# опасные lookup-плагины (см. lookup_query.yml) — эти два правила должны
# работать вместе.
#
# Детект: найти таск с модулем template — remote_src здесь не помогает,
# считать модуль опасным всегда. Отдельно — содержимое самого файла src
# (если он доступен сканеру) нужно проверять на lookup(/query( так же,
# как обычный плейбук.
