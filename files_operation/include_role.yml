# Два разных риска сразу:
# 1) путь с "../" выходит за пределы папки с ролями — можно подключить
#    произвольную директорию сервера как "роль";
# 2) даже если путь ограничить папкой с ролями — если внутри роли есть
#    подпапки library/, module_utils/, action_plugins/, lookup_plugins/,
#    filter_plugins/ и похожие, Ansible загружает файлы из них и исполняет
#    как python-код на сервере при использовании роли. Это уже не утечка
#    данных, а выполнение произвольного кода на сервере.
# import_role и play-level ключ "roles:" — те же риски, другой синтаксис.

- hosts: all
  tasks:
    - include_role:
        name: ../../../opt/test_kc
    # - import_role: {name: ...}   # то же самое
# roles:
#   - test_kc                      # то же самое на уровне плейбука

# Безопасно только при выполнении ОБОИХ условий:
#  - путь роли ограничен только папкой с ролями проекта (без ../ и
#    абсолютных путей);
#  - содержимое самой роли проверено и запрещённых подпапок в ней нет —
#    разрешены только tasks/, vars/, defaults/, files/, templates/,
#    handlers/, meta/.
#
# Детект:
#   \b(include|import)_role\s*:   и play-level ключ roles:
#   плюс отдельная проверка: name не содержит "..", не абсолютный путь.
#   Плюс рекурсивный обход директории роли на предмет library/,
#   module_utils/, action_plugins/, lookup_plugins/, filter_plugins/,
#   cache_plugins/, callback_plugins/, connection_plugins/,
#   become_plugins/, inventory_plugins/, vars_plugins/, strategy_plugins/,
#   terminal_plugins/, test_plugins/ — если такая подпапка есть, роль
#   блокировать целиком.
