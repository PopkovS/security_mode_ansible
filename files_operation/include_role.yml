- hosts: all
  tasks:
    - include_role:
        # Путь с "../" выходит за пределы папки с ролями — это позволяет
        # подключить произвольную директорию сервера как "роль".
        name: ../../../opt/test_kc
    # Но даже если путь ограничить только папкой с ролями, остаётся более
    # серьёзная проблема: если внутри роли есть подпапки library/,
    # module_utils/, action_plugins/, lookup_plugins/, filter_plugins/ и
    # похожие — файлы из них Ansible загружает и исполняет как python-код
    # на сервере при использовании роли. Это уже не утечка данных, а
    # выполнение произвольного кода на сервере от имени ansible-процесса.
    # Модуль можно считать безопасным, только если помимо ограничения пути
    # роли, содержимое самой роли проверяется и такие папки в ней запрещены —
    # разрешены только tasks/, vars/, defaults/, files/, templates/,
    # handlers/, meta/.