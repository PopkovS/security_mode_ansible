- hosts: all
  tasks:
    - unarchive:
        # По умолчанию (remote_src не указан или false) src — архив на
        # сервере, который распаковывается на клиенте. Файл сервера уходит
        # клиенту целиком, ещё и в виде архива, то есть может содержать
        # сразу много данных.
        src: /usr/share/assistant/ast-ansible/PASHA_ANS/archive.tar.gz
        dest: /opt/test
    # remote_src: true делает src архивом на клиенте — тогда сервер файл
    # не читает вообще, и опасности для сервера нет.