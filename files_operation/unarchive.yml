# По умолчанию (remote_src не указан или false) src — архив на сервере,
# который распаковывается на клиенте. Файл сервера уходит целиком,
# ещё и в виде архива — может содержать сразу много данных.

- hosts: all
  tasks:
    - unarchive:
        src: /usr/share/assistant/ast-ansible/PASHA_ANS/archive.tar.gz
        dest: /opt/test

# Безопасно с remote_src: true — тогда src это архив на клиенте, сервер
# файл вообще не читает.
#
# Детект: модуль unarchive, есть src, remote_src отсутствует или false
# → блокировать. Так же как copy/assemble.
