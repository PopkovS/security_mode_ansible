# Модуль всегда запускает rsync НА СЕРВЕРЕ, независимо от
# hosts/connection/delegate_to в плейбуке — то есть блокировка этих
# директив (delegation_to_server.yml) его не ловит. По умолчанию
# (mode: push) src читается на сервере и уходит клиенту, плюс есть
# параметр rsync_opts — через него можно передать сырые опции rsync
# и обойти почти любые ограничения на src/dest.

- hosts: all
  tasks:
    - ansible.posix.synchronize:
        src: /usr/share/assistant/ast-ansible/appsettings.json
        dest: /opt/appsettings.json

# Из-за rsync_opts довести модуль до безопасного состояния сложно —
# проще запретить целиком (ansible.posix.synchronize и
# ansible.legacy.synchronize) и предложить copy/fetch вместо него.
#
# Детект: модуль synchronize (любой FQCN) — блокировать без исключений.
