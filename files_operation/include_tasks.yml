- hosts: all
  tasks:
    # Подключает список тасков из файла на сервере и выполняет их как часть
    # плейбука. Проблема не в самом модуле, а в том, что подключаемый файл
    # может содержать любой другой опасный модуль (copy, script, lookup),
    # который ваш сканер не увидит, если проверяет только этот файл.
    - include_tasks: /usr/share/assistant/ast-ansible/PASHA_ANS/tasks.yml
    # Чтобы модуль стал безопасным, содержимое подключаемого файла нужно
    # обязательно прогонять через тот же сканер до запуска, включая всё,
    # что этот файл в свою очередь подключает. Без этого include_tasks —
    # готовый способ обойти проверку.