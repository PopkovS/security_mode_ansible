# src читается на сервере и уходит клиенту — прямая утечка файла.

- hosts: all
  tasks:
    - ansible.builtin.copy:
        src: /usr/share/assistant/ast-ansible/appsettings.json
        dest: /opt/appsettings.json

# Безопасно с remote_src: true — тогда src читается на клиенте, не на сервере.
# Безопасно с content: вместо src — это просто текст в плейбуке, файлы
# сервера не читаются вообще.
#
# Детект: найти таск с модулем copy (ansible.builtin.copy / ansible.legacy.copy
# / просто copy), и если есть параметр src — проверить, что рядом либо нет
# remote_src, либо remote_src: false → блокировать. remote_src: true → ок.
