- hosts: all
  tasks:
    - fetch:
        # Работает в обратную сторону: читает файл с клиента и пишет его
        # на СЕРВЕР по пути dest. Опасность — не чтение, а запись файла
        # в произвольное место на сервере, если dest не ограничен.
        src: /etc/PASH_TEST
        dest: /usr/share/assistant/ast-ansible/PASHA_ANS
        # У этого модуля были известные баги, когда итоговый путь на сервере
        # собирался из имени хоста и src без должной проверки, и вредоносное
        # имя хоста могло вывести запись за пределы dest. Обязательно нужна
        # актуальная версия ansible-core и явный контроль, куда реально
        # пишется файл после подстановки всех переменных.