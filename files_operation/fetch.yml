# Работает в обратную сторону: читает файл с клиента и пишет его
# НА СЕРВЕР по пути dest. Опасность — не чтение, а запись файла
# в произвольное место на сервере, если dest не ограничен.

- hosts: all
  tasks:
    - fetch:
        src: /etc/PASH_TEST
        dest: /usr/share/assistant/ast-ansible/PASHA_ANS

# У модуля были баги, когда итоговый путь на сервере собирался из имени
# хоста и src без нормальной проверки, и вредоносное имя хоста могло
# вывести запись за пределы dest. Нужна актуальная версия ansible-core
# и отдельная проверка, куда реально пишется файл после подстановки
# всех переменных (включая inventory_hostname).
#
# Детект: модуль fetch — разрешать только с dest внутри фиксированной
# подпапки, и после рендера всех переменных проверять, что итоговый
# нормализованный путь не выходит за пределы этой подпапки (простой
# regex тут не поможет — нужна нормализация пути в коде).
