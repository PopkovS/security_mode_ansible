# src — директория на сервере, все файлы из неё склеиваются в один
# и уходят клиенту. Можно вытащить сразу много файлов за раз.

- hosts: all
  gather_facts: false
  tasks:
    - assemble:
        src: /usr/share/assistant/ast-ansible/PASHA_ANS
        dest: /opt/result.txt
        remote_src: false

# Безопасно с remote_src: true — тогда src это директория на клиенте,
# не на сервере.
#
# Детект: модуль assemble, параметр src + remote_src отсутствует или false
# → блокировать. Та же логика проверки remote_src, что у copy.
