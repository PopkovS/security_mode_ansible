- hosts: all
  gather_facts: false

  tasks:
    - command: hostname
      # delegate_to: localhost выполняет конкретный таск на сервере, даже
      # если play целиком нацелен на обычных клиентов. Проверять нужно
      # каждый таск отдельно, а не только play-level hosts.
      delegate_to: localhost
      register: out

    - debug:
        var: out.stdout