- hosts: all
  tasks:
    - debug:
        # query() — это то же самое, что lookup(), просто всегда возвращает
        # список. Выполняется на сервере точно так же. Если сканер ищет
        # только вызовы lookup(...), он пропустит query(...) с теми же
        # опасными плагинами (pipe, file, env, url и т.д.).
        var: query('pipe', 'hostname')