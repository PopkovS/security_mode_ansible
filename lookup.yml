- hosts: all
  gather_facts: false

  tasks:
    # Все lookup-плагины ниже выполняются НА СЕРВЕРЕ в момент рендеринга
    # Jinja2, независимо от того, в каком модуле и в каком поле они стоят
    # (debug, set_fact, when, vars — где угодно). query('pipe', ...) —
    # то же самое, что lookup('pipe', ...), просто всегда возвращает список,
    # проверять нужно оба варианта синтаксиса.

    - debug:
        # читает файл на сервере и возвращает его содержимое клиенту
        msg: "{{ lookup('file', '/etc/hostname') }}"

    - debug:
        # выполняет произвольную shell-команду на сервере, отдаёт вывод — RCE
        msg: "{{ lookup('pipe', 'hostname') }}"

    - debug:
        # читает переменные окружения ansible-процесса на сервере — там
        # могут быть пароли/токены, если сервис их получает через env
        msg: "{{ lookup('env', 'DB_PASSWORD') }}"

    - debug:
        # читает файл на сервере И рендерит его как Jinja2 — совмещает
        # риск lookup('file') с риском модуля template
        msg: "{{ lookup('template', '/etc/ansible/secret.yml.j2') }}"

    - debug:
        # делает HTTP-запрос С СЕРВЕРА — SSRF, доступ к внутренней сети
        # сервера и к cloud metadata (169.254.169.254) с его учётками
        msg: "{{ lookup('url', 'http://169.254.169.254/latest/meta-data/', split_lines=false) }}"

    - debug:
        # то же самое, что lookup('pipe', ...), другой синтаксис вызова
        var: query('pipe', 'hostname')

    # Список неполный — есть ещё csvfile, ini, password (пишет/читает файлы
    # на сервере), redis, dnstxt (сетевой запрос с сервера) и т.д. Проверять
    # стоит не конкретные имена плагинов, а сам факт вызова lookup(...)/
    # query(...) с любым именем плагина — и вести allowlist безопасных
    # (например, только вычисляющие что-то без обращения к файлам/сети/env),
    # а не blocklist опасных, чтобы не пропустить новый плагин.