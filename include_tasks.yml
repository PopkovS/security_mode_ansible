# Проблема не в самом модуле, а в том, что подключаемый файл может
# содержать любой другой опасный модуль, который ваш сканер не увидит,
# если проверяет только этот файл. include_tasks/import_tasks/
# import_playbook — три варианта одной и той же проблемы.

- hosts: all
  tasks:
    - include_tasks: /usr/share/assistant/ast-ansible/PASHA_ANS/tasks.yml
    # - import_tasks: tasks.yml        # то же самое, статическое включение
# import_playbook: другой_плейбук.yml  # на уровне плейбука целиком

# Безопасно, только если содержимое подключаемого файла обязательно
# прогоняется через тот же сканер до запуска, рекурсивно (включая всё,
# что этот файл в свою очередь подключает). Без рекурсии — это готовый
# способ обойти проверку одним вложенным файлом.
#
# Детект:
#   \b(include|import)_tasks\s*:
#   \bimport_playbook\s*:
# После нахождения — сканер обязан открыть указанный файл и проверить
# его тем же набором правил, а не просто зафиксировать факт вызова.
