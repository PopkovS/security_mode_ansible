- hosts: all
  gather_facts: false

  tasks:
    - debug:
        # lookup('file', ...) читает файл на сервере и возвращает его
        # содержимое клиенту. Работает в любом модуле и в любом поле,
        # не только в debug — например в set_fact, when, vars.
        msg: "{{ lookup('file', '/etc/hostname') }}"